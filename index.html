<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shark Events</title><style>
:root{font-family:system-ui,sans-serif;color:#eaf8ff;background:#071629}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#071629,#103656);min-height:100vh}.app{max-width:1050px;margin:auto;padding:18px}.panel{background:#102d4b;border:1px solid #2e5575;border-radius:12px;padding:15px;margin:12px 0}header,.flex,.actions{display:flex;align-items:center;gap:10px}header{margin-bottom:16px}header h1{font-size:26px;margin:0}header h1 span{color:#4bd2ed}.muted{color:#aac8db;font-size:13px}button{background:#17486c;color:white;border:1px solid #3d7695;border-radius:9px;padding:10px 13px;cursor:pointer;font:inherit}button:hover{filter:brightness(1.15)}button.primary{background:#4bd2ed;color:#06243a;border-color:#4bd2ed;font-weight:750}button.danger{color:#ffb7c3;border-color:#96546c}.actions{flex-wrap:wrap;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:#123754;padding:14px;border-radius:10px}.stat strong{display:block;font-size:23px;margin-top:5px}.tabs{display:flex;overflow-x:auto;gap:6px;margin:14px 0}.tabs button{white-space:nowrap}.tabs .on{background:#4bd2ed;color:#06243a;font-weight:800}.event{width:100%;display:flex;align-items:center;gap:8px;text-align:left;margin:6px 0;background:#09253e}.event.on{background:#18557a;border-color:#4bd2ed}input,textarea,select{background:#071d34;border:1px solid #426b87;color:white;border-radius:8px;padding:10px;width:100%;font:inherit;min-width:0}textarea{min-height:80px}label{display:block;color:#bad7e7;font-size:13px;margin:0 0 5px}.field{margin-bottom:12px}.entry{background:#09243e;border:1px solid #315979;border-radius:10px;padding:13px;margin-bottom:10px}.entry p{overflow-wrap:anywhere}.report-section{border-top:1px solid #41657e;padding:15px 0}.report-entry{padding:9px 0;border-bottom:1px solid #294961;overflow-wrap:anywhere}.report-entry div{margin-top:4px}.report-label{font-weight:650;color:#a7dcef}.report-entry .report-label:after{content:': '}.hidden{display:none!important}.report-print-header{display:none}#report{scroll-margin-top:15px}@media(max-width:540px){.app{padding:11px}.grid{grid-template-columns:1fr}header h1{font-size:22px}header{flex-wrap:wrap}}@media print{body{background:white!important;color:#111!important}.app>*:not(#report){display:none!important}#report{display:block!important;border:0!important;background:white!important;color:#111!important;margin:0;padding:0}.report-print-header{display:block!important}#report *{color:#111!important;background:white!important}.report-section,.report-entry{break-inside:avoid}#report .actions{display:none!important}@page{size:A4;margin:15mm}}
</style></head><body><div class="app"><header><span style="font-size:36px">🦈</span><div style="flex:1"><h1>SHARK <span>EVENTS</span></h1><div class="muted">ESPORTS COMMAND CENTRE</div></div><button id="export">↓ Backup</button></header><section class="panel"><div class="flex" style="justify-content:space-between"><strong>🏁 Shark Racing</strong><button id="toggle" aria-expanded="true">⌃</button></div><div id="events"></div><div id="create" class="panel hidden" style="background:#09253e"><label for="new-name">New competition name</label><input id="new-name" placeholder="e.g. F1 Esports Championship" maxlength="100"><div id="create-error" style="color:#ffb7c3"></div><div class="actions"><button class="primary" id="confirm">Create Competition</button><button id="cancel-create">Cancel</button></div></div><button class="primary" id="new" style="width:100%;margin-top:10px">+ New Competition</button></section><div id="active" class="panel" style="background:linear-gradient(110deg,#15527a,#10304d)"></div><div class="actions"><button class="primary" id="show-report">📋 View Full Event Plan</button><button id="print">🖨️ Print / Save as PDF</button></div><nav id="tabs" class="tabs"></nav><main id="main"></main><section id="report" class="panel hidden"></section><footer class="actions" style="justify-content:space-between"><span class="muted" id="status">🦈 Ready</span><div><button id="import">Import backup</button><input id="file" type="file" accept=".json,application/json" class="hidden"></div></footer></div><script>
(()=>{'use strict';const $=s=>document.querySelector(s),KEY='shark-events-racing-v4';const specs={schedule:{title:'📅 Schedule',fields:[['date','datetime-local','Date and time'],['activity','text','Match / activity'],['location','text','Rig / location'],['owner','text','Responsible person'],['status','select','Status',['Planned','Ready','In progress','Complete','Delayed']]]},risks:{title:'⚠️ Risk Assessment',fields:[['hazard','text','Hazard'],['people','text','People affected'],['likelihood','select','Likelihood',['Low','Medium','High']],['impact','select','Impact',['Low','Medium','High']],['controls','textarea','Control measures'],['owner','text','Responsible person'],['status','select','Status',['Open','Mitigated','Closed']]]},equipment:{title:'🎮 Equipment',fields:[['item','text','Resource / equipment'],['quantity','number','Quantity needed'],['available','number','Quantity available'],['owner','text','Supplier / owner'],['notes','textarea','Notes'],['status','select','Status',['Needed','Ordered','Ready','In use','Returned']]]},budget:{title:'💷 Budget Tracker',fields:[['item','text','Item name'],['category','select','Category',['Venue','Equipment','Prizes','Staff','Marketing','Travel','Catering','Other']],['type','select','Type',['Expense','Income']],['estimated','number','Estimated (£)'],['actual','number','Actual (£)'],['status','select','Status',['Planned','Committed','Paid','Received']]]},contingency:{title:'🛟 Contingency Plans',fields:[['scenario','text','Potential problem'],['trigger','text','Activation trigger'],['action','textarea','Backup action'],['owner','text','Responsible person'],['resources','text','Backup resources'],['priority','select','Priority',['Low','Medium','High','Critical']],['status','select','Status',['Ready','Needs work','Activated','Resolved']]]}};const tabs=[['overview','🏠 Overview'],...Object.entries(specs).map(([k,v])=>[k,v.title])],uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9),fresh=name=>({id:uid(),name,game:'',date:'',venue:'',format:'',players:'',notes:'',budgetLimit:1000,...Object.fromEntries(Object.keys(specs).map(k=>[k,[]]))});let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data||!Array.isArray(data.events)||!data.events.length){const e=fresh('Shark Racing');data={events:[e],active:e.id}}data.events.forEach(e=>{for(const k in specs)if(!Array.isArray(e[k]))e[k]=[];if(e.budgetLimit==null)e.budgetLimit=1000});if(!data.events.some(e=>e.id===data.active))data.active=data.events[0].id;let tab='overview',expanded=true,editing=null,adding=false,pending=null,reportOpen=false;const current=()=>data.events.find(e=>e.id===data.active)||data.events[0],esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=v=>'£'+Number(v||0).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2}),sum=(type,key)=>current().budget.filter(x=>x.type===type).reduce((n,x)=>n+Number(x[key]||0),0);function save(){try{localStorage.setItem(KEY,JSON.stringify(data));$('#status').textContent='✓ Saved in this browser'}catch{$('#status').textContent='⚠ Storage unavailable — export a backup'}}function field(k,t,label,value,options){return `<div class="field"><label>${esc(label)}</label>${t==='textarea'?`<textarea data-field="${k}">${esc(value)}</textarea>`:t==='select'?`<select data-field="${k}">${options.map(v=>`<option ${v===value?'selected':''}>${esc(v)}</option>`).join('')}</select>`:`<input data-field="${k}" type="${t}" ${t==='number'?'min="0" step="0.01"':''} value="${esc(value)}">`}</div>`}function read(){const o={};$('#main').querySelectorAll('[data-field]').forEach(el=>o[el.dataset.field]=el.type==='number'?Number(el.value||0):el.value);return o}function stat(label,v){return `<div class="stat"><div class="muted">${label}</div><strong>${v}</strong></div>`}function render(){const e=current();$('#toggle').textContent=expanded?'⌃':'⌄';$('#toggle').setAttribute('aria-expanded',String(expanded));$('#events').innerHTML=expanded?data.events.map((x,i)=>`<button class="event ${x.id===e.id?'on':''}" data-event="${esc(x.id)}"><span>${i===0?'🦈':'🏆'}</span><span style="flex:1">${esc(x.name)}</span>${x.id===e.id?'✓':''}</button>`).join(''):'';$('#active').innerHTML=`<div class="muted">CURRENT COMPETITION</div><div style="font-size:21px;font-weight:850;margin:5px 0">${esc(e.name)}</div><div class="muted">${esc([e.game,e.date,e.venue].filter(Boolean).join(' • ')||'Plan your next esports event')}</div>`;$('#tabs').innerHTML=tabs.map(([k,v])=>`<button data-tab="${k}" class="${tab===k?'on':''}">${v}</button>`).join('');if(tab==='overview')overview();else list();$('#report').classList.toggle('hidden',!reportOpen);$('#show-report').textContent=reportOpen?'✕ Close Full Event Plan':'📋 View Full Event Plan';if(reportOpen)report()}function overview(){const e=current(),spent=sum('Expense','actual');$('#main').innerHTML=`<div class="grid">${stat('Budget remaining',money(Number(e.budgetLimit)-spent))}${stat('Actual spending',money(spent))}${stat('Schedule entries',e.schedule.length)}${stat('Open risks',e.risks.filter(x=>!['Closed','Mitigated'].includes(x.status)).length)}</div><div class="panel"><h3>⚙️ Competition details</h3><div class="grid">${[['name','text','Competition name'],['game','text','Game'],['date','date','Event date'],['venue','text','Venue'],['format','text','Format'],['players','text','Teams / players']].map(([k,t,l])=>field(k,t,l,e[k])).join('')}</div>${field('notes','textarea','Notes',e.notes)}<div class="actions"><button class="primary" data-action="saveOverview">Save details</button><button class="danger" data-action="askDeleteEvent">Delete competition</button></div>${pending==='event'?`<div class="panel"><strong>Delete ${esc(e.name)}?</strong><div class="actions"><button class="danger" data-action="confirmDeleteEvent">Yes, delete</button><button data-action="cancelDelete">Cancel</button></div></div>`:''}</div><div class="panel"><h3>🌊 Planning progress</h3>${Object.entries(specs).map(([k,s])=>`<div style="padding:6px 0">${e[k].length?'✅':'○'} ${s.title} <span class="muted">(${e[k].length})</span></div>`).join('')}</div>`}function list(){const e=current(),s=specs[tab],items=e[tab];let html=`<div class="flex" style="justify-content:space-between;margin-bottom:10px"><h3 style="margin:0">${s.title}</h3><button class="primary" data-action="add">+ Add</button></div>`;if(tab==='budget'){const spent=sum('Expense','actual');html+=`<div class="panel"><label>Total competition budget (£)</label><div class="flex"><input id="limit" type="number" min="0" step="0.01" value="${esc(e.budgetLimit)}"><button class="primary" data-action="saveLimit">Save</button></div></div><div class="grid" style="margin-bottom:10px">${stat('Remaining',money(Number(e.budgetLimit)-spent))}${stat('Spent',money(spent))}${stat('Estimated',money(sum('Expense','estimated')))}${stat('Income',money(sum('Income','actual')))}</div>`}if(adding||editing){const old=editing?items.find(x=>x.id===editing)||{}:{};html+=`<div class="panel"><h3>${editing?'Edit':'New'} entry</h3><div class="grid">${s.fields.map(([k,t,l,o])=>field(k,t,l,old[k]??(t==='number'?0:''),o)).join('')}</div><div class="actions"><button class="primary" data-action="saveItem">Save entry</button><button data-action="cancel">Cancel</button></div></div>`}if(!items.length)html+='<div class="panel muted" style="text-align:center;padding:22px">🦈 No entries yet. Add your first one.</div>';items.forEach(x=>{const name=x.item||x.activity||x.hazard||x.scenario||'Untitled';let details=tab==='budget'?`${esc(x.type)} • Estimated ${money(x.estimated)} • Actual ${money(x.actual)}`:tab==='schedule'?`${esc((x.date||'').replace('T',' '))} • ${esc(x.location)}`:tab==='equipment'?`${esc(x.available||0)} of ${esc(x.quantity||0)} available`:tab==='risks'?`${esc(x.likelihood)} likelihood • ${esc(x.controls)}`:`${esc(x.priority)} priority • ${esc(x.action)}`;html+=`<div class="entry"><div class="flex" style="justify-content:space-between"><strong>${esc(name)}</strong><span class="muted">${esc(x.status||'Planned')}</span></div><p class="muted">${details}</p><div class="actions"><button data-action="edit" data-id="${esc(x.id)}">✎ Edit</button><button class="danger" data-action="askDelete" data-id="${esc(x.id)}">🗑 Delete</button></div>${pending===x.id?`<div class="panel"><strong>Delete ${esc(name)}?</strong><div class="actions"><button class="danger" data-action="confirmDelete" data-id="${esc(x.id)}">Yes, delete</button><button data-action="cancelDelete">Cancel</button></div></div>`:''}</div>`});$('#main').innerHTML=html}function report(){const e=current(),spent=sum('Expense','actual');let html=`<div class="report-print-header"><h1>SHARK EVENTS — EVENT PLAN</h1></div><h2>📋 ${esc(e.name)}</h2><div class="report-section"><h3>🏁 Competition Overview</h3>${[['Game',e.game],['Date',e.date],['Venue / platform',e.venue],['Format',e.format],['Teams / players',e.players],['Notes',e.notes]].map(([k,v])=>`<div class="report-entry"><span class="report-label">${k}</span>: ${esc(v||'Not specified')}</div>`).join('')}</div><div class="report-section"><h3>💷 Financial Summary</h3><div class="grid">${stat('Total budget',money(e.budgetLimit))}${stat('Remaining',money(Number(e.budgetLimit)-spent))}${stat('Actual expenses',money(spent))}${stat('Income',money(sum('Income','actual')))}</div></div>`;for(const [k,s] of Object.entries(specs)){html+=`<div class="report-section"><h3>${s.title} (${e[k].length})</h3>`;if(!e[k].length)html+='<p class="muted">No entries added.</p>';e[k].forEach((item,i)=>{html+=`<div class="report-entry"><strong>Entry ${i+1}</strong>${s.fields.map(([key,t,label])=>`<div><span class="report-label">${esc(label)}</span>${esc(t==='number'&&k==='budget'?money(item[key]):item[key]??'—')}</div>`).join('')}</div>`});html+='</div>'}html+='<div class="actions"><button class="primary" data-action="printReport">🖨️ Print / Save as PDF</button><button data-action="closeReport">Close report</button></div>';$('#report').innerHTML=html}function closeCreate(){$('#create').classList.add('hidden');$('#new').classList.remove('hidden');$('#new-name').value='';$('#create-error').textContent=''}function createEvent(){const name=$('#new-name').value.trim();if(!name){$('#create-error').textContent='Please enter a competition name.';return}const e=fresh(name);data.events.push(e);data.active=e.id;tab='overview';expanded=true;editing=null;adding=false;pending=null;closeCreate();save();render()}$('#new').onclick=()=>{$('#create').classList.remove('hidden');$('#new').classList.add('hidden');$('#new-name').focus()};$('#confirm').onclick=createEvent;$('#cancel-create').onclick=closeCreate;$('#new-name').addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();createEvent()}});$('#toggle').onclick=()=>{expanded=!expanded;render()};$('#events').onclick=ev=>{const b=ev.target.closest('[data-event]');if(!b)return;data.active=b.dataset.event;tab='overview';adding=false;editing=null;pending=null;save();render()};$('#tabs').onclick=ev=>{const b=ev.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;adding=false;editing=null;pending=null;render()};$('#show-report').onclick=()=>{reportOpen=!reportOpen;render();if(reportOpen)$('#report').scrollIntoView({behavior:'smooth',block:'start'})};function printReport(){reportOpen=true;render();window.print()}$('#print').onclick=printReport;$('#report').onclick=ev=>{const b=ev.target.closest('[data-action]');if(!b)return;if(b.dataset.action==='printReport')printReport();else if(b.dataset.action==='closeReport'){reportOpen=false;render()}};$('#main').onclick=ev=>{const b=ev.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id,e=current();if(a==='saveOverview'){Object.assign(e,read());e.name=e.name.trim()||'Untitled Competition';save();render();return}if(a==='askDeleteEvent'){pending='event';render();return}if(a==='confirmDeleteEvent'){data.events=data.events.filter(x=>x.id!==e.id);if(!data.events.length)data.events.push(fresh('Shark Racing'));data.active=data.events[0].id;pending=null;save();render();return}if(a==='saveLimit'){const n=Number($('#limit').value);if(!Number.isFinite(n)||n<0){alert('Enter a valid budget');return}e.budgetLimit=n;save();render();return}if(a==='add'){adding=true;editing=null;pending=null;render();return}if(a==='edit'){editing=id;adding=false;pending=null;render();return}if(a==='cancel'){adding=false;editing=null;render();return}if(a==='askDelete'){pending=id;render();return}if(a==='cancelDelete'){pending=null;render();return}if(a==='confirmDelete'){const i=e[tab].findIndex(x=>String(x.id)===String(id));if(i>=0)e[tab].splice(i,1);pending=null;if(editing===id)editing=null;save();render();return}if(a==='saveItem'){const v=read(),first=specs[tab].fields[0][0];if(!String(v[first]??'').trim()){alert('Please complete the first field');return}if(editing){const old=e[tab].find(x=>x.id===editing);if(old)Object.assign(old,v)}else e[tab].push({id:uid(),...v});editing=null;adding=false;save();render()}};$('#export').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='shark-events-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#import').onclick=()=>$('#file').click();$('#file').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(!Array.isArray(obj.events)||!obj.events.length||!obj.events.every(e=>e&&e.id&&typeof e.name==='string'&&Object.keys(specs).every(k=>Array.isArray(e[k]))))throw Error('Invalid backup');if(!confirm('Replace existing competitions with imported backup?'))return;data=obj;data.active=data.events.some(e=>e.id===obj.active)?obj.active:data.events[0].id;tab='overview';closeCreate();save();render()}catch(err){alert('Import failed: '+err.message)}ev.target.value=''};render()})();
</script></body></html>
